<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Grade Calculator</h1>

        <h2 class="section-heading">Student Credentials</h2>

        <div class="input-group">
            <label>Student Name</label>
            <input type="text" id="studentName" placeholder="Enter student name">
            <small class="error" id="nameError"></small>
        </div>

        <div class="input-group">
            <label>Roll Number</label>
            <input type="text" id="rollNumber" placeholder="Enter roll number">
            <small class="error" id="rollError"></small>
        </div>

        <div class="input-group">
            <label>Academic Year</label>
            <input type="text" id="academicYear" placeholder="e.g. 2024-2025">
            <small class="error" id="yearError"></small>
        </div>

        <h2 class="section-heading">Subject Performance</h2>
        <p class="subtitle">Enter marks (0 - 100)</p>

        <form id="gradeForm">

            <div class="input-group">
                <label>Data Structures & Algorithms</label>
                <input type="number" id="dsa" min="0" max="100" required>
                <small class="error" id="dsaError"></small>
            </div>

            <div class="input-group">
                <label>Object Oriented Programming</label>
                <input type="number" id="oop" min="0" max="100" required>
                <small class="error" id="oopError"></small>
            </div>

            <div class="input-group">
                <label>Software Engineering & Modeling</label>
                <input type="number" id="sem" min="0" max="100" required>
                <small class="error" id="semError"></small>
            </div>

            <div class="input-group">
                <label>Database Management Systems</label>
                <input type="number" id="dbms" min="0" max="100" required>
                <small class="error" id="dbmsError"></small>
            </div>

            <div class="input-group">
                <label>Operating Systems</label>
                <input type="number" id="os" min="0" max="100" required>
                <small class="error" id="osError"></small>
            </div>

            <button type="button" onclick="calculateGrade()">Calculate Grade</button>

        </form>

        <div id="result" class="result-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
